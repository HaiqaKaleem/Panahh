name: PANAGAH CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ── Lint & Format Check ──────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linters
        run: pip install ruff

      - name: Ruff lint
        run: ruff check app/ --select E,F --output-format=github || true

      - name: Ruff format check
        run: ruff format --check app/ || true

  # ── Test Suite ───────────────────────────────────────────────────────
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install bcrypt==4.0.1 pytest-cov

      - name: Verify imports
        run: |
          python -c "from app.main import app; print('App imports OK')"
          python -c "from app.engineering.cost_analysis import analyze_local_market; print('Cost analysis imports OK')"

      - name: Run tests
        env:
          ENVIRONMENT: testing
        run: |
          python -m pytest tests/ -v --tb=short -x 2>&1 | tail -50

  # ── Docker Build ─────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t panagah:latest .
        continue-on-error: true
